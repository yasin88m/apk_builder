<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>پیش‌نمایش تمام‌صفحه اپلیکیشن</title><link rel="stylesheet" href="/font.css"><link rel="stylesheet" href="/scene.css"><style>body{margin:0;font-family:Vazirmatn,Tahoma;background:#eee}.preview-return{position:fixed;left:10px;top:10px;z-index:200001;font:11px Vazirmatn,Tahoma;color:#fff;background:#262330d9;border:1px solid #ffffff25;padding:7px 12px;border-radius:20px;text-decoration:none}.preview-error{margin:20vh auto;padding:20px;max-width:450px;text-align:center}</style></head><body><a class="preview-return" href="/editor">بازگشت به ادیتور</a><main id="preview-app"></main><script type="module">import{normalize}from'/model.js';import{mountScene}from'/scene.js';const root=document.getElementById('preview-app');try{const key=new URLSearchParams(location.search).get('project')||'new';document.querySelector('.preview-return').href=key==='new'?'/editor':'/editor?id='+encodeURIComponent(key);const config=normalize(JSON.parse(localStorage.getItem('studio-preview:'+key)||'null'));if(!config.scene)throw Error();mountScene(config.scene,root,{preview:true});}catch{root.className='preview-error';root.textContent='برای مشاهده پیش‌نمایش، ابتدا از داخل ادیتور روی پیش‌نمایش تمام‌صفحه بزنید.';}</script></body></html>
