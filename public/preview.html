<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/font.css"><link rel="stylesheet" href="/mobile.css"><link rel="stylesheet" href="/canvas-editor.css"><title>پیش‌نمایش اپلیکیشن</title></head><body><main id="mobile-app"></main><script type="module">import{mountMobile}from'/mobile.js';import{mountCanvas}from'/canvas-editor.js';import{normalize,demo}from'/model.js';let current=null;function show(c){const scroll=window.scrollY;const old=document.getElementById('mobile-app');const next=document.createElement('main');next.id='mobile-app';old.replaceWith(next);mountMobile(normalize(c),next,{editing:new URLSearchParams(location.search).get('editing')==='1'});if(new URLSearchParams(location.search).get('editing')==='1')mountCanvas(normalize(c));window.scrollTo(0,scroll);}const params=new URLSearchParams(location.search);show(demo(params.get('template')||'servly'));window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='app-preview')return;show(e.data.config);});parent.postMessage({type:'preview-ready'},location.origin);</script></body></html>
