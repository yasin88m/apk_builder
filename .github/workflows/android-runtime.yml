name: Build and verify Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/android*.mjs'
      - 'src/zip.mjs'
      - 'scripts/build-native.sh'
      - 'scripts/sign-sample.mjs'
      - '.github/workflows/android-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile native Android runtime and verify signed APK
        run: bash scripts/build-native.sh
      - name: Save compiled runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/android-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m "Build compiled Android runtime [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-verification
          path: |
            .native-build/sample.apk
            .native-build/runtime.apk
