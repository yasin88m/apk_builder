name: Build and verify Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/mobile.js'
      - 'public/mobile.css'
      - 'public/model.js'
      - 'src/android*.mjs'
      - 'src/zip.mjs'
      - 'scripts/build-native.sh'
      - 'scripts/sign-sample.mjs'
      - 'scripts/test-android-device.sh'
      - '.github/workflows/android-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile native Android runtime and verify signed APK
        run: bash scripts/build-native.sh
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK, render offline and test update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test-android-device.sh
      - name: Save compiled runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/android-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m "Build compiled Android runtime [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk-verification
          path: |
            .native-build/*.apk
            .native-build/runtime.apk
            .native-build/*-screen.png
            .native-build/*-ui.xml
            .native-build/device-log.txt
            .native-build/apksigner.jar
