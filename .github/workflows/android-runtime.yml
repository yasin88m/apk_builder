name: Build and verify Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/mobile.js'
      - 'public/mobile.css'
      - 'public/font.css'
      - 'public/model.js'
      - 'public/scene.js'
      - 'public/scene.css'
      - 'public/catalog-media.js'
      - 'public/icons.js'
      - 'public/icons-NOTICE.txt'
      - 'public/template-media.svg'
      - 'src/android*.mjs'
      - 'src/zip.mjs'
      - 'scripts/build-native.sh'
      - 'scripts/sign-sample.mjs'
      - 'scripts/test-android-device.sh'
      - '.github/workflows/android-runtime.yml'
  workflow_dispatch:
concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile native Android runtime and verify signed APK
        run: bash scripts/build-native.sh
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK, render offline and test update
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: timeout 240s bash scripts/test-android-device.sh
      - name: Save compiled runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          # Never save a runtime built from inputs that have since changed.
          if ! git diff --quiet HEAD origin/main -- android public/model.js public/mobile.js src/android.mjs src/zip.mjs scripts/build-native.sh; then
            echo "Source changed during build; leaving the newer run to save its runtime."
            exit 0
          fi
          cp public/android-runtime.json /tmp/verified-android-runtime.json
          git restore public/android-runtime.json
          git checkout -B runtime-update origin/main
          cp /tmp/verified-android-runtime.json public/android-runtime.json
          git add public/android-runtime.json
          git diff --cached --quiet && exit 0
          git commit -m "Build compiled Android runtime"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk-verification
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .native-build/*.apk
            .native-build/runtime.apk
            .native-build/*-screen.png
            .native-build/*-ui.xml
            .native-build/device-log.txt
            .native-build/apksigner.jar
